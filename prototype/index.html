<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Browser</title>
<style>
:root{
  --bg:#f6f5f2;--panel:#ffffff;--panel2:#efeee9;--ink:#1d1c1a;--muted:#6d6a63;--line:#dedcd5;
  --accent:#2f5d50;--claude:#c96442;--codex:#3a6fd8;--opencode:#7a5cc4;--danger:#b4372f;
  --user:#e9efe9;--code:#f1f0ec;
  --mono:ui-monospace,"Cascadia Code","JetBrains Mono",Consolas,monospace;
  --sans:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--panel:#1c1c1a;--panel2:#242422;--ink:#ecebe6;--muted:#9a978f;--line:#33322f;
  --accent:#7fb8a6;--claude:#e08a6a;--codex:#79a3f2;--opencode:#ab93e6;--danger:#e87a72;
  --user:#1f2a26;--code:#232321;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:380px 1fr;height:100vh}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.brand{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand h1{font-size:15px;margin:0;letter-spacing:.01em;cursor:pointer}
.brand small{color:var(--muted)}
.controls{padding:0 16px 10px;display:grid;gap:8px}
.controls input,.controls select{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}
.row{display:flex;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;gap:6px}
.chip[aria-pressed=true]{background:var(--panel2);border-color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.claude{background:var(--claude)}.dot.codex{background:var(--codex)}.dot.opencode{background:var(--opencode)}
.list{overflow:auto;flex:1;border-top:1px solid var(--line)}
.item{padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;gap:2px}
.item:hover{background:var(--panel2)}
.item.active{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{color:var(--muted);font-size:12px;display:flex;gap:8px;align-items:center;overflow:hidden;white-space:nowrap}
.item .m span{overflow:hidden;text-overflow:ellipsis}
.item .snip{font-size:12px;color:var(--muted);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{padding:8px 16px;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
main{overflow:auto;min-width:0}
.wrap{max-width:1040px;margin:0 auto;padding:24px 28px 80px}
h2{font-size:20px;margin:0 0 4px}
h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 0 10px}
.sub{color:var(--muted);font-size:13px;word-break:break-all}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card .k{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.card .v{font-size:24px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.card .d{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line);font-size:13px}
th{color:var(--muted);font-weight:600;background:var(--panel2)}
th:first-child,td:first-child{text-align:left}
tr.click{cursor:pointer}tr.click:hover td{background:var(--panel2)}
td.ttl{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 14px 6px}
.bars{display:flex;align-items:flex-end;gap:2px;height:160px}
.bar{flex:1;display:flex;flex-direction:column-reverse;min-width:3px;position:relative}
.bar i{display:block}
.bar:hover{outline:1px solid var(--muted)}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;padding-top:6px}
.legend{display:flex;gap:14px;color:var(--muted);font-size:12px;margin-bottom:8px}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:6px;font-size:12px;z-index:9;white-space:pre}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px;align-items:center}
.toolbar label{display:flex;gap:5px;align-items:center;font-size:13px;color:var(--muted);cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13px}
.btn:hover{background:var(--panel2)}
.msgs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin-top:14px}
.msg{border-radius:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);min-width:0}
.msg.user{background:var(--user)}
.msg .hd{font-size:12px;color:var(--muted);display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.msg .hd b{color:var(--ink)}
.msg .body{white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.msg .body p{margin:0 0 .6em}
details.blk{border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px}
details.blk>summary{padding:6px 12px;cursor:pointer;color:var(--muted);list-style:none;display:flex;gap:8px;align-items:center;overflow:hidden;white-space:nowrap}
details.blk>summary::before{content:"▸";font-size:10px}
details.blk[open]>summary::before{content:"▾"}
details.blk>summary .nm{color:var(--ink);font-family:var(--mono);font-weight:600}
details.blk>summary .pv{overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:12px}
details.blk pre{margin:0;padding:10px 12px;border-top:1px solid var(--line);max-height:480px;overflow:auto}
details.blk.err>summary{color:var(--danger)}
pre,code{font-family:var(--mono);font-size:12.5px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--code)}
.body pre{padding:10px 12px;border-radius:7px;overflow:auto;white-space:pre}
.body code{background:var(--code);padding:1px 4px;border-radius:4px}
.body pre code{background:none;padding:0}
.usage{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.img{max-width:100%;max-height:420px;border-radius:6px;border:1px solid var(--line)}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--muted)}
.loc{font-family:var(--mono);font-size:12px;color:var(--muted);word-break:break-all}
.back{display:none}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{display:var(--aside,flex)}
  main{display:var(--main,none)}
  .back{display:inline-block}
  .wrap{padding:16px}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside>
    <div class="brand">
      <h1 onclick="showOverview()">Session Browser</h1>
      <button class="btn" id="refresh" title="Rescan session stores">Rescan</button>
    </div>
    <div class="controls">
      <input id="q" placeholder="Filter by title, folder, prompt…" autocomplete="off">
      <div class="row">
        <input id="fts" placeholder="Search inside conversations (Enter)" autocomplete="off">
      </div>
      <div class="chips" id="srcChips"></div>
      <div class="row">
        <select id="sort">
          <option value="end">Most recent</option>
          <option value="tokens">Most tokens</option>
          <option value="turns">Most prompts</option>
          <option value="start">Oldest first</option>
        </select>
        <select id="proj"><option value="">All folders</option></select>
      </div>
    </div>
    <div class="list" id="list"></div>
    <div class="foot" id="foot">Loading…</div>
  </aside>
  <main id="main"><div class="wrap" id="view"></div></main>
</div>
<div class="tip" id="tip" hidden></div>
<script>
const SRC = {claude:"Claude Code", codex:"Codex", opencode:"OpenCode"};
const state = {sessions:[], sources:new Set(["claude","codex","opencode"]), active:null, hits:null, show:{tools:true, thinking:true, meta:false}};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => n == null ? "–" : n >= 1e9 ? (n/1e9).toFixed(2)+"B" : n >= 1e6 ? (n/1e6).toFixed(1)+"M" : n >= 1e3 ? (n/1e3).toFixed(1)+"k" : String(n);
const num = n => (n||0).toLocaleString();
const tot = t => t ? (t.input||0)+(t.output||0)+(t.cache_read||0)+(t.cache_write||0) : 0;
const date = ms => ms ? new Date(ms).toLocaleString(undefined,{year:"numeric",month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"}) : "";
const ago = ms => { if(!ms) return ""; const s=(Date.now()-ms)/1000; if(s<3600) return Math.max(1,s/60|0)+"m ago"; if(s<86400) return (s/3600|0)+"h ago"; if(s<86400*30) return (s/86400|0)+"d ago"; return new Date(ms).toLocaleDateString(); };
const folder = p => p ? p.replace(/\\/g,"/").replace(/\/$/,"").split("/").slice(-2).join("/") : "";
const allTok = s => { const t={...s.tokens}; if(s.subagent_tokens) for(const k in t) t[k]+= s.subagent_tokens[k]||0; return t; };
const isMobile = () => matchMedia("(max-width:820px)").matches;

function mobileView(which){ if(!isMobile()) return; document.documentElement.style.setProperty("--aside", which==="list"?"flex":"none"); document.documentElement.style.setProperty("--main", which==="list"?"none":"block"); }

async function api(p, opt){ const r = await fetch(p, opt); if(!r.ok) throw new Error(await r.text()); return r.json(); }

async function load(){
  let st = await api("/api/status");
  while(st.state !== "ready"){
    $("#foot").textContent = `Indexing… ${st.done}/${st.total||"?"}`;
    await new Promise(r=>setTimeout(r,500)); st = await api("/api/status");
  }
  state.status = st;
  state.sessions = (await api("/api/sessions")).filter(s => !s.parent); // OpenCode child sessions are shown under their parent
  const projs = [...new Set(state.sessions.map(s=>s.cwd).filter(Boolean))].sort();
  $("#proj").innerHTML = `<option value="">All folders (${projs.length})</option>` + projs.map(p=>`<option value="${esc(p)}">${esc(folder(p))}</option>`).join("");
  renderChips(); renderList();
  const h = decodeURIComponent(location.hash.slice(1));
  if(h) openSession(h); else showOverview();
}

function renderChips(){
  const counts = {}; state.sessions.forEach(s=>counts[s.source]=(counts[s.source]||0)+1);
  $("#srcChips").innerHTML = Object.keys(SRC).map(k=>`<button class="chip" aria-pressed="${state.sources.has(k)}" data-k="${k}"><span class="dot ${k}"></span>${SRC[k]} <span style="color:var(--muted)">${counts[k]||0}</span></button>`).join("");
  $("#srcChips").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const k=b.dataset.k; state.sources.has(k)?state.sources.delete(k):state.sources.add(k); renderChips(); renderList(); if(!state.active) showOverview();});
}

function filtered(){
  const q = $("#q").value.trim().toLowerCase(), proj = $("#proj").value, sort = $("#sort").value;
  let arr = state.sessions.filter(s => state.sources.has(s.source) && (!proj || s.cwd===proj));
  if(q) arr = arr.filter(s => [s.title,s.cwd,s.first_prompt,s.id,...Object.keys(s.models||{})].join(" ").toLowerCase().includes(q));
  if(state.hits){ const ids = new Map(state.hits.map(h=>[h.id,h.snippet])); arr = arr.filter(s=>ids.has(s.id)).map(s=>({...s,_snip:ids.get(s.id)})); }
  const key = {end:s=>-(s.end||0), start:s=>s.start||0, tokens:s=>-tot(allTok(s)), turns:s=>-(s.turns||0)}[sort];
  return arr.sort((a,b)=>key(a)-key(b));
}

function renderList(){
  const arr = filtered();
  $("#list").innerHTML = arr.length ? arr.map(s=>`
    <div class="item ${state.active===s.id?"active":""}" data-id="${esc(s.id)}">
      <div class="t">${esc(s.title)}</div>
      <div class="m"><span class="dot ${s.source}"></span><span>${esc(folder(s.cwd)) || "–"}</span><span style="margin-left:auto;flex:none">${fmt(tot(allTok(s)))} tok · ${ago(s.end)}</span></div>
      ${s._snip?`<div class="snip">${esc(s._snip)}</div>`:""}
    </div>`).join("") : `<div class="empty">No sessions match.</div>`;
  $("#list").querySelectorAll(".item").forEach(el=>el.onclick=()=>openSession(el.dataset.id));
  const t = arr.reduce((a,s)=>a+tot(allTok(s)),0);
  $("#foot").textContent = `${arr.length} of ${state.sessions.length} sessions · ${fmt(t)} tokens` + (state.hits?` · ${state.hits.length} search hits`:"");
}

/* ---------------- Overview ---------------- */
function showOverview(){
  state.active = null; history.replaceState(null,"",location.pathname); renderList(); mobileView("main");
  const arr = filtered();
  const by = {}; Object.keys(SRC).forEach(k=>by[k]={n:0,t:{input:0,output:0,cache_read:0,cache_write:0,reasoning:0},cost:0});
  const models = {};
  for(const s of arr){
    const b = by[s.source]; b.n++; const t = allTok(s); for(const k in b.t) b.t[k]+=t[k]||0; b.cost += s.cost||0;
    for(const [m,mt] of Object.entries(s.models||{})){ const x = models[m] ||= {src:s.source,n:0,input:0,output:0,cache_read:0,cache_write:0}; x.n++; for(const k of ["input","output","cache_read","cache_write"]) x[k]+=mt[k]||0; }
    for(const sub of s.subagents||[]) for(const [m,mt] of Object.entries(sub.models||{})){ const x = models[m] ||= {src:s.source,n:0,input:0,output:0,cache_read:0,cache_write:0}; for(const k of ["input","output","cache_read","cache_write"]) x[k]+=mt[k]||0; }
  }
  const grand = Object.values(by).reduce((a,b)=>a+tot(b.t),0);
  const cards = Object.entries(by).filter(([k])=>state.sources.has(k)).map(([k,b])=>`
    <div class="card"><div class="k"><span class="dot ${k}"></span>${SRC[k]} · ${b.n} sessions</div>
      <div class="v">${fmt(tot(b.t))}</div>
      <div class="d">in ${fmt(b.t.input)} · out ${fmt(b.t.output)}<br>cache read ${fmt(b.t.cache_read)} · write ${fmt(b.t.cache_write)}${b.t.reasoning?`<br>reasoning ${fmt(b.t.reasoning)}`:""}${b.cost?`<br>recorded cost $${b.cost.toFixed(2)}`:""}</div></div>`).join("");
  const top = [...arr].sort((a,b)=>tot(allTok(b))-tot(allTok(a))).slice(0,15);
  const mrows = Object.entries(models).sort((a,b)=>tot(b[1])-tot(a[1]));
  const loc = state.status.locations;
  $("#view").innerHTML = `
    <button class="btn back" onclick="mobileView('list')">← Sessions</button>
    <h2>Overview</h2><div class="sub">${arr.length} sessions · ${fmt(grand)} tokens total (input + output + cache)</div>
    <h3>By tool</h3><div class="cards">${cards}</div>
    <h3>Tokens per day · last 60 days</h3>${dayChart(arr)}
    <h3>Biggest sessions</h3>
    <table><tr><th>Session</th><th>When</th><th>Input</th><th>Output</th><th>Cache read</th><th>Total</th></tr>
    ${top.map(s=>{const t=allTok(s);return `<tr class="click" data-id="${esc(s.id)}"><td class="ttl"><span class="dot ${s.source}"></span> ${esc(s.title)}</td><td>${new Date(s.end).toLocaleDateString()}</td><td>${fmt(t.input+t.cache_write)}</td><td>${fmt(t.output)}</td><td>${fmt(t.cache_read)}</td><td><b>${fmt(tot(t))}</b></td></tr>`}).join("")}</table>
    <h3>By model</h3>
    <table><tr><th>Model</th><th>Sessions</th><th>Input</th><th>Output</th><th>Cache read</th><th>Cache write</th></tr>
    ${mrows.map(([m,x])=>`<tr><td><span class="dot ${x.src}"></span> ${esc(m)}</td><td>${x.n}</td><td>${fmt(x.input)}</td><td>${fmt(x.output)}</td><td>${fmt(x.cache_read)}</td><td>${fmt(x.cache_write)}</td></tr>`).join("")}</table>
    <h3>Where the sessions live</h3>
    <div class="card"><div class="loc"><b>Claude Code</b> &nbsp;${esc(loc.claude)}\\&lt;project&gt;\\&lt;session-id&gt;.jsonl<br>
    <b>Codex</b> &nbsp;${loc.codex.map(esc).join("<br>&nbsp;&nbsp;&nbsp;&nbsp;")}<br>
    <b>OpenCode</b> &nbsp;${esc(loc.opencode)} (SQLite)</div></div>`;
  $("#view").querySelectorAll("tr.click").forEach(r=>r.onclick=()=>openSession(r.dataset.id));
  bindTips();
}

function dayChart(arr){
  const days = 60, now = new Date(); now.setHours(0,0,0,0); const start = now.getTime() - (days-1)*864e5;
  const buckets = Array.from({length:days},()=>({claude:0,codex:0,opencode:0}));
  for(const s of arr){ const d = new Date(s.end||s.start); d.setHours(0,0,0,0); const i = Math.round((d-start)/864e5); if(i>=0&&i<days) buckets[i][s.source]+=tot(allTok(s)); }
  const max = Math.max(1,...buckets.map(b=>b.claude+b.codex+b.opencode));
  const bars = buckets.map((b,i)=>{ const d=new Date(start+i*864e5); const tip=`${d.toLocaleDateString()}\nClaude ${fmt(b.claude)}\nCodex ${fmt(b.codex)}\nOpenCode ${fmt(b.opencode)}`;
    return `<div class="bar" data-tip="${esc(tip)}" style="height:100%">${["claude","codex","opencode"].map(k=>`<i style="height:${b[k]/max*100}%;background:var(--${k})"></i>`).join("")}</div>`; }).join("");
  return `<div class="chart"><div class="legend">${Object.entries(SRC).map(([k,v])=>`<span><span class="dot ${k}"></span> ${v}</span>`).join("")}<span style="margin-left:auto">peak ${fmt(max)}/day · sessions dated by last activity</span></div>
    <div class="bars">${bars}</div><div class="axis"><span>${new Date(start).toLocaleDateString()}</span><span>today</span></div></div>`;
}
function bindTips(){ const tip=$("#tip"); document.querySelectorAll("[data-tip]").forEach(el=>{ el.onmousemove=e=>{tip.hidden=false; tip.textContent=el.dataset.tip; tip.style.left=Math.min(e.clientX+12, innerWidth-170)+"px"; tip.style.top=(e.clientY+12)+"px";}; el.onmouseleave=()=>tip.hidden=true; }); }

/* ---------------- Session view ---------------- */
function md(text){
  // tiny, safe markdown: fenced code, inline code, bold, headings, links
  const parts = String(text).split(/```/);
  return parts.map((p,i)=>{
    if(i%2){ const nl=p.indexOf("\n"); const body = nl>=0? p.slice(nl+1):p; return `<pre><code>${esc(body.replace(/\n$/,""))}</code></pre>`; }
    return esc(p).replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")
      .replace(/^#{1,6} (.+)$/gm,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  }).join("");
}

async function openSession(id){
  const s = state.sessions.find(x=>x.id===id) || findSub(id);
  state.active = id; history.replaceState(null,"","#"+encodeURIComponent(id)); renderList(); mobileView("main");
  $("#view").innerHTML = `<div class="empty">Loading conversation…</div>`;
  let data; try { data = await api("/api/session?id="+encodeURIComponent(id)); } catch(e){ $("#view").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`; return; }
  state.msgs = data.messages; state.cur = s;
  renderSession();
}
function findSub(id){ for(const s of state.sessions) for(const sub of s.subagents||[]) if(sub.id===id) return {...s, ...sub, title:"Subagent · "+(sub.title||""), subagents:[], subagent_tokens:null, _parent:s.id, models:sub.models||{}}; return null; }

function renderSession(){
  const s = state.cur || {}, msgs = state.msgs || [], sh = state.show;
  const t = s.tokens || {}, st = s.subagent_tokens;
  const callNames = {}; msgs.forEach(m=>{ if(m.kind==="tool_call") callNames[m.id]=m.name; });
  const counts = {tool:msgs.filter(m=>m.kind==="tool_call").length, thinking:msgs.filter(m=>m.kind==="thinking").length, meta:msgs.filter(m=>m.kind==="meta").length};
  const html = msgs.map(m=>{
    if(m.kind==="tool_call"){ if(!sh.tools) return ""; const pv = m.text.replace(/\s+/g," ").slice(0,140);
      return `<details class="blk"><summary><span class="nm">${esc(m.name)}</span><span class="pv">${esc(pv)}</span></summary><pre>${esc(m.text)}</pre></details>`; }
    if(m.kind==="tool_result"){ if(!sh.tools) return ""; const pv=(m.text||"").replace(/\s+/g," ").slice(0,140);
      return `<details class="blk ${m.error?"err":""}"><summary>↳ ${esc(callNames[m.id]||"result")}${m.error?" · error":""}<span class="pv">${esc(pv)}</span></summary><pre>${esc(m.text)}</pre></details>`; }
    if(m.kind==="thinking"){ if(!sh.thinking) return ""; return `<details class="blk"><summary>Thinking<span class="pv">${esc(m.text.replace(/\s+/g," ").slice(0,140))}</span></summary><pre>${esc(m.text)}</pre></details>`; }
    if(m.kind==="meta"){ if(!sh.meta) return ""; return `<details class="blk"><summary>${esc(m.role)} context<span class="pv">${esc((m.text||"").replace(/\s+/g," ").slice(0,140))}</span></summary><pre>${esc(m.text)}</pre></details>`; }
    if(m.kind==="image") return `<div class="msg user"><div class="hd"><b>You</b> ${date(m.time)}</div>${m.image?`<img class="img" src="${esc(m.image)}" alt="attached image">`:"[image]"}</div>`;
    const u = m.usage ? `<div class="usage">in ${num(m.usage.input)} · out ${num(m.usage.output)}${m.usage.cache_read?` · cache read ${num(m.usage.cache_read)}`:""}${m.usage.cache_write?` · cache write ${num(m.usage.cache_write)}`:""}${m.usage.reasoning?` · reasoning ${num(m.usage.reasoning)}`:""}</div>` : "";
    return `<div class="msg ${m.role}"><div class="hd"><b>${m.role==="user"?"You":"Assistant"}</b>${m.model&&m.model!=="<synthetic>"?`<span>${esc(m.model)}</span>`:""}<span>${date(m.time)}</span></div><div class="body">${md(m.text)}</div>${u}</div>`;
  }).join("");
  const subs = (s.subagents||[]);
  $("#view").innerHTML = `
    <button class="btn back" onclick="mobileView('list')">← Sessions</button>
    ${s._parent?`<button class="btn" onclick="openSession('${esc(s._parent)}')">← Parent session</button>`:""}
    <h2>${esc(s.title)}</h2>
    <div class="sub"><span class="dot ${s.source}"></span> ${SRC[s.source]||""}${s.client?` · ${esc(s.client)}`:""} · ${date(s.start)} → ${date(s.end)}${s.branch?` · branch ${esc(s.branch)}`:""}${s.archived?` · <span class="pill">archived</span>`:""}</div>
    <div class="sub">${esc(s.cwd||"")}</div>
    <div class="cards" style="margin-top:14px">
      <div class="card"><div class="k">Total tokens</div><div class="v">${fmt(tot(t))}</div><div class="d">${num(tot(t))}</div></div>
      <div class="card"><div class="k">Input / Output</div><div class="v">${fmt(t.input)} / ${fmt(t.output)}</div><div class="d">${t.reasoning?`reasoning ${fmt(t.reasoning)}`:"uncached input / generated"}</div></div>
      <div class="card"><div class="k">Cache read / write</div><div class="v">${fmt(t.cache_read)} / ${fmt(t.cache_write)}</div><div class="d">${s.cost?`recorded cost $${s.cost.toFixed(2)}`:"&nbsp;"}</div></div>
      <div class="card"><div class="k">Prompts · messages</div><div class="v">${s.turns ?? "–"} · ${msgs.length}</div><div class="d">${Object.keys(s.models||{}).map(esc).join(", ")||"&nbsp;"}</div></div>
      ${st && tot(st)?`<div class="card"><div class="k">Subagents (${subs.length})</div><div class="v">${fmt(tot(st))}</div><div class="d">extra tokens from subagents</div></div>`:""}
    </div>
    ${subs.length?`<h3>Subagents</h3><table>${subs.map(x=>`<tr class="click" data-id="${esc(x.id)}"><td class="ttl">${esc(x.title||x.id)}</td><td>${fmt(tot(x.tokens))}</td></tr>`).join("")}</table>`:""}
    <div class="toolbar">
      <label><input type="checkbox" data-k="tools" ${sh.tools?"checked":""}> Tool calls (${counts.tool})</label>
      <label><input type="checkbox" data-k="thinking" ${sh.thinking?"checked":""}> Thinking (${counts.thinking})</label>
      <label><input type="checkbox" data-k="meta" ${sh.meta?"checked":""}> System/context (${counts.meta})</label>
      <span style="margin-left:auto" class="loc" title="Source file">${esc(s.path||"")}</span>
    </div>
    <div class="msgs">${html || `<div class="empty">No messages.</div>`}</div>`;
  $("#view").querySelectorAll(".toolbar input").forEach(cb=>cb.onchange=()=>{state.show[cb.dataset.k]=cb.checked; renderSession();});
  $("#view").querySelectorAll("tr.click").forEach(r=>r.onclick=()=>openSession(r.dataset.id));
}

/* ---------------- wiring ---------------- */
$("#q").oninput = () => { renderList(); if(!state.active) showOverview(); };
$("#sort").onchange = $("#proj").onchange = () => { renderList(); if(!state.active) showOverview(); };
$("#fts").onkeydown = async e => {
  if(e.key!=="Enter") return;
  const q = e.target.value.trim();
  if(!q){ state.hits=null; renderList(); return; }
  $("#foot").textContent = "Searching inside conversations…";
  state.hits = await api("/api/search?q="+encodeURIComponent(q)); renderList();
};
$("#fts").oninput = e => { if(!e.target.value.trim() && state.hits){ state.hits=null; renderList(); } };
$("#refresh").onclick = async () => { await api("/api/refresh",{method:"POST"}); $("#list").innerHTML=""; load(); };
load().catch(e=>$("#foot").textContent="Error: "+e.message);
</script>
</body>
</html>
